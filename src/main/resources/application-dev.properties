# =========================================================
# PROFIL DEV - DEMARRAGE LOCAL SANS VARIABLES D'ENVIRONNEMENT
# =========================================================
# Activation : --spring.profiles.active=dev
#
# ATTENTION : ce fichier ne doit contenir AUCUN secret reel.
# Les valeurs ci-dessous servent uniquement au developpement local.
# En production, le profil "dev" n'est pas active et les secrets
# proviennent exclusivement des variables d'environnement.

# ---------- JWT ----------
# Cle de developpement (64 caracteres, compatible HMAC-SHA256).
# La variable d'environnement JWT_SECRET reste prioritaire si elle est definie.
jwt.secret=${JWT_SECRET:dev_only_secret_local_rang_moy_gaaw_transport_jee_2026_abcdef}

# ---------- PostgreSQL ----------
# Mot de passe du conteneur Docker local (deja en clair dans docker-compose.yml).
# La variable d'environnement DB_PASSWORD reste prioritaire si elle est definie.
spring.datasource.password=${DB_PASSWORD:senegal2026}

# ---------- PayTech ----------
# Valeurs FACTICES : elles permettent uniquement au contexte Spring de demarrer.
# Les appels reels a l'API PayTech echoueront tant que les vraies cles ne sont
# pas fournies via les variables d'environnement PAYTECH_API_KEY / PAYTECH_API_SECRET.
paytech.api.key=${PAYTECH_API_KEY:dev_fake_paytech_api_key}
paytech.api.secret=${PAYTECH_API_SECRET:dev_fake_paytech_api_secret}
