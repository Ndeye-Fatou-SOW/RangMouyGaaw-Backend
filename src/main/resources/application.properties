# =========================================================
# TRANSPORT SERVICE - CONFIGURATION (SAFE)
# =========================================================

# ---------- Profil actif ----------
# "dev" par defaut pour permettre le demarrage local sans variables d'environnement.
# En production : definir SPRING_PROFILES_ACTIVE=prod (les secrets viennent alors
# exclusivement des variables d'environnement, cf. application-dev.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Serveur ----------
server.port=8080

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/transport_db}
spring.datasource.username=${DB_USERNAME:transport_senegal}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- HikariCP (stabilité connexions) ----------
spring.datasource.hikari.pool-name=TransportHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:300000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:5000}

# TTL GPS (augmenté pour absorber les coupures temporaires Kafka/DB)
transport.gps.cache-ttl-seconds=${GPS_CACHE_TTL_SECONDS:1800}
# Simulation automatique des positions GPS (a desactiver quand les vrais
# boitiers GPS / l'app chauffeur seront branches)
transport.gps.simulation.enabled=${GPS_SIMULATION_ENABLED:true}

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:transport-service}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.enable-auto-commit=${KAFKA_ENABLE_AUTO_COMMIT:true}


spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=sn.rangmoygaaw.transport.infrastructure.messaging.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=sn.rangmoygaaw.transport.infrastructure.messaging.kafka.BusPositionEvent

# Timeouts/résilience
spring.kafka.consumer.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT_MS:45000}
spring.kafka.consumer.properties.heartbeat.interval.ms=${KAFKA_HEARTBEAT_INTERVAL_MS:15000}
spring.kafka.consumer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:60000}
spring.kafka.consumer.properties.max.poll.interval.ms=${KAFKA_MAX_POLL_INTERVAL_MS:300000}

# Listener
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:2}
spring.kafka.listener.ack-mode=${KAFKA_ACK_MODE:batch}
spring.kafka.listener.missing-topics-fatal=false

# ---------- WebSocket / Message broker (optionnel) ----------
spring.websocket.message-broker.task-executor.core-pool-size=${WS_CORE_POOL_SIZE:2}
spring.websocket.message-broker.task-executor.max-pool-size=${WS_MAX_POOL_SIZE:8}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.kafka.enabled=false
management.health.redis.enabled=false

# ---------- Security auto-config (comme ton setup actuel) ----------
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# ---------- JWT (SECRET VIA ENV UNIQUEMENT) ----------
# Aucune valeur par défaut : l'application refuse de démarrer sans JWT_SECRET.
# Le profil "dev" (application-dev.properties) fournit une clé de développement
# pour démarrer en local sans variable d'environnement.
# Générer une clé : openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ---------- PayTech (SECRETS VIA ENV UNIQUEMENT) ----------
paytech.api.key=${PAYTECH_API_KEY}
paytech.api.secret=${PAYTECH_API_SECRET}

paytech.ipn.url=${PAYTECH_IPN_URL:https://example.com/api/v1/transport/tickets/ipn}
paytech.success.url=${PAYTECH_SUCCESS_URL:https://example.com/citoyen/ticket/success}
paytech.cancel.url=${PAYTECH_CANCEL_URL:https://example.com/citoyen/ticket/cancel}

# ---------- Logging ----------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.sn.rangmoygaaw=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:INFO}
logging.level.org.hibernate.type.descriptor.sql=${LOG_LEVEL_HIBERNATE_BINDER:INFO}


# ---------- Google Gemini (assistant Dama dem) ----------
# Optionnelle : sans elle l'application démarre normalement, seul
# l'assistant répond qu'il est indisponible (voir TransportAiService).
gemini.api.key=${GEMINI_API_KEY:}
#gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.model=gemini-3.5-flash
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB